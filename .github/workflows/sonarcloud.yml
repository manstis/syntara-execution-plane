---
name: SonarCloud Upload

# Fork fallback: this workflow is loaded from the default branch and runs after
# PR CI completes. Same-repository PRs use the inline SonarCloud job in ci.yml.
# It checks out fork-controlled source but executes only pinned actions and
# trusted gh/git commands; it does not run repository code from the PR.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Upload
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name != github.event.workflow_run.repository.full_name
    steps:
      - name: Fetch PR number
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ep-pr-number
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          if-no-files-found: error

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pr_number="$(tr -cd '0-9' < pr-number.txt)"
          pr_base="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.base.ref')"
          pr_head="$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.ref')"

          {
            printf 'number=%s\n' "$pr_number"
            printf 'base=%s\n' "$pr_base"
            printf 'head=%s\n' "$pr_head"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          show-progress: false
          persist-credentials: false

      - name: Download combined coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ep-coverage-combined
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          if-no-files-found: error

      - name: Check coverage files
        run: |
          set -euo pipefail
          test -s coverage.xml
          test -s pytest-results.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets[vars.SONAR_TOKEN_SECRET_NAME] }}
        with:
          args: >-
            -Dsonar.projectKey=syntara-orchestration_syntara-execution-plane
            -Dsonar.organization=syntara-orchestration
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            -Dsonar.pullrequest.key=${{ steps.pr.outputs.number }}
            -Dsonar.pullrequest.branch=${{ steps.pr.outputs.head }}
            -Dsonar.pullrequest.base=${{ steps.pr.outputs.base }}
