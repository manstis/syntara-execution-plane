name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: direct-meta
        with:
          images: ghcr.io/syntara-orchestration/execution-plane
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest
      - uses: docker/metadata-action@v5
        id: journal-meta
        with:
          images: ghcr.io/syntara-orchestration/execution-plane-journal
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest
      - name: Build and publish direct image
        uses: ./.github/actions/container-build
        with:
          push: "true"
          tags: ${{ steps.direct-meta.outputs.tags }}
          labels: ${{ steps.direct-meta.outputs.labels }}
      - name: Build and publish Journal image
        uses: ./.github/actions/container-build
        with:
          file: Containerfile.journal
          push: "true"
          tags: ${{ steps.journal-meta.outputs.tags }}
          labels: ${{ steps.journal-meta.outputs.labels }}
