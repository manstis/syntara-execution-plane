apiVersion: v1
kind: Service
metadata:
  name: execution-plane-api
  labels:
    app.kubernetes.io/name: execution-plane
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: execution-plane
    app.kubernetes.io/component: api
  ports:
  - name: https
    port: 8443
    targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-plane-api
  labels:
    app.kubernetes.io/name: execution-plane
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-plane
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-plane
        app.kubernetes.io/component: api
    spec:
      containers:
      - name: api
        image: ghcr.io/syntara-orchestration/execution-plane:latest
        imagePullPolicy: IfNotPresent
        command:
        - execution-plane-api
        ports:
        - name: https
          containerPort: 8443
        env:
        - name: EP_API_HOST
          value: 0.0.0.0
        - name: EP_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: execution-plane-db
              key: runtime-url
        - name: EP_CREDENTIAL_ENCRYPTION_KEY_PATH
          value: /run/secrets/ep/credential-encryption-key
        - name: EP_API_PORT
          value: '8443'
        - name: EP_API_TLS_CERT_PATH
          value: /run/secrets/server/tls.crt
        - name: EP_API_TLS_KEY_PATH
          value: /run/secrets/server/tls.key
        - name: EP_API_TLS_CLIENT_CA_PATH
          value: /run/secrets/ao/ca.pem
        - name: EP_PARTICIPANT_ID
          value: execution-plane
        - name: EP_COMMAND_PEERS_PATH
          value: /run/secrets/ep/command-peers.json
        - name: EP_COMMAND_SIGNING_KEY_PATH
          value: /run/secrets/ep/ep-command.pem
        - name: EP_COMMAND_SIGNING_KEY_ID
          value: primary
        - name: EP_COMMAND_TLS_CA_PATH
          value: /run/secrets/ao/ca.pem
        - name: EP_COMMAND_TLS_CERT_PATH
          value: /run/secrets/server/tls.crt
        - name: EP_COMMAND_TLS_KEY_PATH
          value: /run/secrets/server/tls.key
        volumeMounts:
        - name: ep-key
          mountPath: /run/secrets/ep
          readOnly: true
        - name: ao-auth
          mountPath: /run/secrets/ao
          readOnly: true
        - name: server-tls
          mountPath: /run/secrets/server
          readOnly: true
        readinessProbe:
          exec:
            command:
            - python3
            - -c
            - import ssl,urllib.request; c=ssl.create_default_context(cafile='/run/secrets/ao/ca.pem'); c.load_cert_chain('/run/secrets/server/tls.crt','/run/secrets/server/tls.key');
              urllib.request.urlopen('https://localhost:8443/healthz/ready',context=c)
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - python3
            - -c
            - import ssl,urllib.request; c=ssl.create_default_context(cafile='/run/secrets/ao/ca.pem'); c.load_cert_chain('/run/secrets/server/tls.crt','/run/secrets/server/tls.key');
              urllib.request.urlopen('https://localhost:8443/healthz/live',context=c)
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
      volumes:
      - name: ep-key
        secret:
          secretName: execution-plane-keys
          items:
          - key: credential-encryption-key
            path: credential-encryption-key
          - key: command-peers.json
            path: command-peers.json
          - key: ep-command.pem
            path: ep-command.pem
          - key: ep-command.pub
            path: ep-command.pub
          - key: ao-jwt-public.pem
            path: ao-jwt-public.pem
      - name: ao-auth
        secret:
          secretName: execution-plane-ao-auth
          items:
          - key: jwt-public.pem
            path: jwt-public.pem
          - key: ca.pem
            path: ca.pem
      - name: server-tls
        secret:
          secretName: execution-plane-api-tls
