[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "execution-plane-transport-journal"
version = "0.1.0"
description = "Optional durable Journal transport for execution-plane commands"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "execution-plane-transport-direct>=0.1.0,<0.2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "sqlalchemy[asyncio]>=2.0.0",
]

[tool.hatch.build.targets.wheel]
include = ["/*.py", "/*.ini", "/py.typed", "/workers/**", "/migrations/**"]

[tool.hatch.build.targets.wheel.sources]
"" = "execution_plane_transport_journal"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.sdist]
include = ["/*.py", "/*.ini", "/py.typed", "/workers/**", "/migrations/**", "/pyproject.toml", "/README.md"]
